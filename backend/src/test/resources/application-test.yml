# 集成测试 profile：内存 H2，测试结束自动销毁
spring:
  datasource:
    url: jdbc:h2:mem:cm_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:sql/schema-h2.sql
